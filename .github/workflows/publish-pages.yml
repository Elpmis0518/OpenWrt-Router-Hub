name: Publish Pages (Firmware & RouteLink Feed)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref/SHA to checkout'
        required: false
        default: ''
        type: string
  workflow_dispatch:

permissions: write-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Firmware Catalog & RouteLink Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build static Pages site from latest Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          python3 ./shared/scripts/build-pages-site.py \
            --repo "${GITHUB_REPOSITORY}" \
            --site-url "https://${OWNER_LOWER}.github.io/${GITHUB_REPOSITORY#*/}" \
            --keys-dir ./routelink/feed/keys \
            --out _site
          find _site -maxdepth 4 -ls

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
