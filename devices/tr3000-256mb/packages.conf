# Cudy TR3000 v1 256MB (ImmortalWrt owrt) declarative package selection
# Keep upstream luci-app-wolultra from GENERAL.txt (do not install luci-app-wol).

# Device-specific kernel modules
CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_cudy_tr3000-v1-256mb="kmod-ifb kmod-sched-cake"
CONFIG_PACKAGE_kmod-ifb=y
CONFIG_PACKAGE_kmod-sched-cake=y

# Added packages
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_routelinkd=y
CONFIG_PACKAGE_luci-app-routelink=y
CONFIG_PACKAGE_luci-proto-wireguard=y
CONFIG_PACKAGE_luci-proto-openvpn=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_luci-app-sqm=y
CONFIG_PACKAGE_luci-app-adblock=y

# Corresponding zh-cn translation packages
CONFIG_PACKAGE_luci-i18n-routelink-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
CONFIG_PACKAGE_luci-i18n-adblock-zh-cn=y
