# Xiaomi AX3000T (LEDE master) declarative package & kernel module selection
# Applied idempotently by devices/ax3000t/scripts/apply-config.py

# Build acceleration (CONFIG_CCACHE depends on CONFIG_DEVEL in OpenWrt/LEDE Kconfig)
CONFIG_DEVEL=y
CONFIG_CCACHE=y

# Preserve upstream UA3F
CONFIG_PACKAGE_ua3f=y

# Do not enable global CONFIG_LUCI_LANG_zh_Hans
CONFIG_LUCI_LANG_zh_Hans=n

# 7 required kernel modules
CONFIG_PACKAGE_kmod-ipt-ipopt=y
CONFIG_PACKAGE_kmod-nft-compat=y
CONFIG_PACKAGE_kmod-ifb=y
CONFIG_PACKAGE_kmod-sched-cake=y
CONFIG_PACKAGE_kmod-sched-core=y
CONFIG_PACKAGE_kmod-sched-flower=y
CONFIG_PACKAGE_kmod-wireguard=y

# Added packages (do not install nftables-*)
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_routelinkd=y
CONFIG_PACKAGE_luci-app-routelink=y
CONFIG_PACKAGE_luci-app-wol=y
CONFIG_PACKAGE_luci-proto-wireguard=y
CONFIG_PACKAGE_openvpn-openssl=y
CONFIG_PACKAGE_luci-app-openvpn=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_luci-app-sqm=y
CONFIG_PACKAGE_luci-app-adblock-fast=y

# Corresponding -zh-cn translation packages for the added plugins only
CONFIG_PACKAGE_luci-i18n-routelink-zh-cn=y
CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y
CONFIG_PACKAGE_luci-i18n-openvpn-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
CONFIG_PACKAGE_luci-i18n-adblock-fast-zh-cn=y
